<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Hucha">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<title>Hucha · Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, honest money talk; numbers first, no guilt
   IDEA: a coin jar on the desk: what goes in, what goes out, what stays
   PICTURE: the month sheet: big "what's left" number over a ribbon of spending colours
   COLOUR and TYPE: night ground, mint for money in, coral for money out, gold accent; Familjen Grotesk + Inter tabular
   LAYOUT: same sidebar/bottom bar as Bandeja; one working column */
:root,:root[data-theme]{color-scheme:dark;--bg:#0d0f14;--ink:#eceef4;--mut:#8b91a0;--line:#252935;--card:#161920;--raise:#1d212b;--field:#11141b;
--gold:#ffd84a;--goldink:#231d00;--in:#3ddc97;--out:#ff6a4d;--blue:#5b74ff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
nav{background:var(--field);color:#d6d9e2;border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{font:700 26px/1 'Familjen Grotesk',sans-serif;padding:4px 12px 22px;display:flex;align-items:center;gap:10px;color:#fff}
.brand svg{width:28px;height:28px;color:var(--gold)}
.nv{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;width:100%;opacity:.85;font-weight:500}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:rgba(255,255,255,.06);opacity:1}
.nv[aria-current=page]{background:var(--gold);color:var(--goldink);opacity:1}
.sep{height:1px;background:var(--line);margin:10px 12px;flex:none}
.navlink{font-size:13px;color:var(--mut);padding:8px 12px;margin-top:auto}
.navlink a{color:inherit}
main{padding:28px clamp(16px,4vw,56px) 64px;max-width:860px;width:100%}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.addbig{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;background:var(--gold);color:var(--goldink);border-radius:16px;padding:0 18px;min-height:56px;font-weight:600;font-size:17px;box-shadow:0 14px 34px -18px rgba(255,216,74,.55)}
.addbig svg{width:22px;height:22px}
.sync{font-size:13px;color:var(--mut);margin:12px 4px 0;display:flex;gap:7px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.sync.ok i{background:var(--in)}.sync.warn i,.sync.err i{background:var(--out)}
h1{font:700 clamp(32px,5vw,46px)/1.05 'Familjen Grotesk',sans-serif;margin:26px 0 8px;text-wrap:balance}
h2{font:700 19px/1.2 'Familjen Grotesk',sans-serif;margin:30px 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font:500 13px Inter,sans-serif;color:var(--mut)}
.lede{color:var(--mut);margin:0 0 8px;max-width:62ch}
.month{display:flex;align-items:center;gap:6px;margin-top:22px}
.month b{font:700 20px 'Familjen Grotesk',sans-serif;min-width:9.5em;text-align:center}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--mut);flex:none;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ib:hover{color:var(--ink)}.ib svg{width:20px;height:20px}
.hero{margin:18px 0 6px}
.hero .lab{color:var(--mut);font-weight:500}
.hero .big{font:700 clamp(54px,11vw,92px)/.95 'Familjen Grotesk',sans-serif;letter-spacing:-.03em;margin:4px 0 10px}
.pos{color:var(--in)}.neg{color:var(--out)}
.io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;max-width:520px}
.io div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.io span{display:block;font-size:13px;color:var(--mut)}
.io b{font:700 22px 'Familjen Grotesk',sans-serif}
.ribbon{display:flex;height:22px;border-radius:99px;overflow:hidden;margin:22px 0 8px;background:var(--line);gap:2px}
.ribbon i{display:block;height:100%;transition:flex .5s}
.cats{display:flex;flex-direction:column;gap:4px}
.cat{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);width:100%}
.dot{width:12px;height:12px;border-radius:50%}
.cat .nm{font-weight:500}.cat .am{font-weight:600}
.cat .sub{grid-column:2/4;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.cat .bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:99px}
.up{color:var(--out)}.down{color:var(--in)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;min-height:56px}
.row .t{flex:1}.row .tt{font-weight:500;display:block;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--mut)}
.row .am{font-weight:600}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:600;margin:18px 4px 6px;text-transform:capitalize}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip .dot{width:9px;height:9px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--raise);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--gold);color:var(--goldink);border-color:var(--gold)}
.btn.warn{color:var(--out)}.btn.danger{background:var(--out);border-color:var(--out);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:30px 22px;text-align:center;color:var(--mut);margin-top:18px}
.empty b{display:block;color:var(--ink);font:700 21px 'Familjen Grotesk',sans-serif;margin-bottom:4px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.goal .tt{font:700 20px/1.2 'Familjen Grotesk',sans-serif}
.gbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1fb37a,#3ddc97 70%,#b8f5d0);transition:width .6s}
.goals{display:grid;gap:12px;margin-top:16px}
.yb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:200px;margin:20px 0 6px}
.yb .m{display:flex;gap:2px;align-items:flex-end;height:100%;justify-content:center}
.yb .m i{display:block;width:44%;max-width:16px;border-radius:5px 5px 0 0;min-height:2px}
.ylab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:12px;color:var(--mut);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stats span{display:block;font-size:13px;color:var(--mut)}.stats b{font:700 22px 'Familjen Grotesk',sans-serif}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.ov{position:fixed;inset:0;background:rgba(5,6,10,.6);display:grid;place-items:center;padding:16px;z-index:20}
.ov[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.step{font-size:13px;font-weight:600;color:var(--gold)}
.sheet h3{font:700 clamp(24px,4vw,28px)/1.1 'Familjen Grotesk',sans-serif;margin:6px 0 14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 6px}
.in{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px}
textarea.in{min-height:110px;font-size:13px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:4px 2px}
.amt input{flex:1;border:0;background:transparent;font:700 52px/1.1 'Familjen Grotesk',sans-serif;outline:0;width:100%;font-variant-numeric:tabular-nums}
.amt span{font:700 34px 'Familjen Grotesk',sans-serif;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed=true].o{background:var(--out);color:#fff}.seg button[aria-pressed=true].i{background:var(--in);color:#06281a}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:44px;font-weight:500}.check input{width:20px;height:20px;accent-color:var(--gold)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;z-index:30;font-size:15px;max-width:calc(100vw - 24px)}
#toast[hidden]{display:none}#toast button{color:#7a5b00;font-weight:700;min-height:36px;padding:0 10px}
@media(max-width:760px){
 .app{grid-template-columns:minmax(0,1fr)}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;gap:0;border-right:0;border-top:1px solid var(--line)}
 .brand,.sep,.navlink{display:none}
 .nv{flex-direction:column;justify-content:center;gap:3px;min-width:68px;width:auto;flex:1 0 auto;padding:6px 4px;font-size:11px;min-height:56px}
 main{padding:calc(14px + env(safe-area-inset-top)) 16px 120px}
 #toast{bottom:92px}
}
@media(max-width:600px){.g2{grid-template-columns:minmax(0,1fr)}.ov{place-items:end center;padding:0}.sheet{border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}.month b{min-width:0;flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
<nav id="nav" aria-label="Secciones"></nav>
<main>
 <div class="top"><button class="addbig" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Apuntar gasto o ingreso</button></div>
 <div id="sync" class="sync"><i></i><span>Abriendo…</span></div>
 <section id="view"></section>
</main>
</div>
<div id="ov" class="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<div id="auth" class="ov" hidden><form class="sheet" id="authF">
 <div class="step">Hucha</div><h3>Entra con tu cuenta de Bandeja</h3>
 <p class="lede">La misma cuenta para las dos apps. Tus datos se sincronizan entre el móvil y el ordenador.</p>
 <label class="f" for="aE">Email</label><input class="in" id="aE" name="email" type="email" autocomplete="email" required>
 <label class="f" for="aP">Contraseña</label><input class="in" id="aP" name="pw" type="password" autocomplete="current-password" minlength="6" required>
 <p class="lede" id="authMsg" style="margin-top:12px"></p>
 <div class="btns"><button class="btn pri" value="in" style="flex:1;justify-content:center">Entrar</button><button class="btn" value="up" style="flex:1;justify-content:center">Crear cuenta</button></div>
</form></div>
<script src="../supabase.js"></script>
<script src="../config.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const D=s=>new Date(s+'T12:00:00');
const T=()=>ymd(new Date());
const thisMonth=()=>T().slice(0,7);
const addM=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mLabel=(m,o={month:'long',year:'numeric'})=>{const s=new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString('es-ES',o);return s.charAt(0).toUpperCase()+s.slice(1)};
const now=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const eur=n=>(Math.round(n*100)/100).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const eur0=n=>Math.round(n).toLocaleString('es-ES')+' €';
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();
const parseAmt=s=>{s=String(s||'').replace(/[€\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const ICON={
home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M9.5 20v-6h5v6"/>',
list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
fixed:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
goals:'<path d="M5 11a7 6 0 0 1 13-2h1.5a1.5 1.5 0 0 1 0 3H19a7 6 0 0 1-3 4.5V19h-2.5v-1.5h-4V19H7v-2.8A6 6 0 0 1 5 11z"/><circle cx="15" cy="10" r=".6" fill="currentColor"/><path d="M10 6.5h3"/>',
year:'<path d="M5 20V10M10 20V4M15 20v-7M20 20v-11"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const VIEWS=[['resumen','Resumen','home'],['movimientos','Movimientos','list'],['fijos','Fijos','fixed'],['ahorro','Ahorro','goals'],['anual','Año','year'],['ajustes','Ajustes','gear']];
const DEF_OUT=['Comida','Restaurantes','Alquiler','Luz','Agua','Gas','Wifi','Moto','Gasolina','Transporte público','Ocio','Viajes','Deporte','Cuidado personal','Medicamentos','Ropa','Impuestos','Regalos','Otros'];
const DEF_IN=['Nómina','Otros ingresos'];
const PAL=['#ff8a4c','#ffd84a','#5b74ff','#3ddc97','#ff5d8f','#b07cff','#3cc8e8','#ff6a4d','#9bd14b','#f4a3ff','#62e0c0','#e8b04a','#8aa0ff','#ff9eb5','#c9d3e6','#ffb86b','#7be0ff','#d9a3ff','#a8b3c7'];

let items=new Map(),ready=false,setStore;const storeP=new Promise(r=>setStore=r);
let view=VIEWS.some(v=>v[0]===location.hash.slice(1))?location.hash.slice(1):'resumen';
let cur=thisMonth(),year=+cur.slice(0,4),q='',fcat='',sheet=null;

/* ---------- data ---------- */
const chain={};
function save(o,quiet){items.set(o.id,o);if(!quiet)render();const d={...o};delete d.id;
 chain[o.id]=(chain[o.id]||Promise.resolve()).then(()=>storeP).then(s=>s.set(o.id,d)).catch(()=>toast('No se pudo guardar'))}
function remove(id){items.delete(id);render();chain[id]=(chain[id]||Promise.resolve()).then(()=>storeP).then(s=>s.del(id)).catch(()=>toast('No se pudo borrar'))}
const all=k=>[...items.values()].filter(i=>i.kind===k);
const txs=()=>all('tx');
const cats=()=>{const m=items.get('cats');return {gasto:m?.gasto||DEF_OUT,ingreso:m?.ingreso||DEF_IN}};
function color(c){const L=[...cats().gasto,...cats().ingreso];const i=L.indexOf(c);return PAL[(i<0?L.length+norm(c).length:i)%PAL.length]}
const ofMonth=m=>txs().filter(t=>(t.date||'').startsWith(m));
const sum=(L,type)=>L.filter(t=>t.type===type).reduce((a,t)=>a+(+t.amount||0),0);
function byCat(L){const o={};for(const t of L)if(t.type==='gasto')o[t.cat||'Otros']=(o[t.cat||'Otros']||0)+(+t.amount||0);return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function avgCat(m,cat){let n=0,s=0;for(let i=1;i<=3;i++){const L=ofMonth(addM(m,-i));if(!L.length)continue;n++;s+=L.filter(t=>t.type==='gasto'&&(t.cat||'Otros')===cat).reduce((a,t)=>a+(+t.amount||0),0)}return n?s/n:null}

/* ---------- fixed ---------- */
function applyFixed(){const tm=thisMonth(),td=+T().slice(8);let n=0;
 for(const f of all('fixed')){if(f.active===false)continue;let m=f.from||tm;let guard=0;
  while(m<=tm&&guard++<36){const last=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),day=Math.min(f.day||1,last),id='fx-'+f.id+'-'+m;
   const due=m<tm||day<=td;if(due&&!items.has(id)&&!(f.skip||[]).includes(m)){save({id,kind:'tx',type:f.type||'gasto',amount:+f.amount,cat:f.cat,desc:f.title,date:m+'-'+pad(day),fixed:f.id,created:now()},true);n++}
   m=addM(m,1)}}
 if(n){render();toast(n===1?'1 gasto fijo apuntado automáticamente':n+' gastos fijos apuntados automáticamente')}}

/* ---------- views ---------- */
const monthBar=()=>`<div class="month"><button class="ib" data-act="mPrev" aria-label="Mes anterior">${ic('left')}</button><b>${mLabel(cur)}</b><button class="ib" data-act="mNext" aria-label="Mes siguiente" ${cur>=thisMonth()?'disabled style="opacity:.35"':''}>${ic('right')}</button></div>`;
function txRow(t){const g=t.type==='gasto';return `<button class="row" data-act="edit" data-id="${t.id}"><span class="dot" style="background:${color(t.cat)}"></span><span class="t"><span class="tt">${esc(t.desc||t.cat)}</span><span class="meta"><span>${esc(t.cat||'')}</span>${t.fixed?'<span>Fijo</span>':''}</span></span><span class="am num ${g?'':'pos'}">${g?'−':'+'}${eur(+t.amount)}</span></button>`}
function grouped(L){const g={};for(const t of L)(g[t.date]=g[t.date]||[]).push(t);
 return Object.keys(g).sort().reverse().map(d=>{const net=g[d].reduce((a,t)=>a+(t.type==='gasto'?-t.amount:+t.amount),0);
  return `<div class="day"><span>${D(d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}</span><span class="num">${net<0?'−':'+'}${eur(Math.abs(net))}</span></div><div class="list">${g[d].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).map(txRow).join('')}</div>`}).join('')}
const R={
resumen(){const L=ofMonth(cur),inc=sum(L,'ingreso'),out=sum(L,'gasto'),net=inc-out,C=byCat(L),max=C[0]?.[1]||1;
 let h=monthBar();

/* ---------- import / export ---------- */
function splitLine(l){if(l.includes('\t'))return l.split('\t');const o=[];let c='',qt=false;for(const ch of l){if(ch==='"'){qt=!qt;continue}if(ch===','&&!qt){o.push(c);c='';continue}c+=ch}o.push(c);return o}
function parseSheet(text){const known=[...cats().gasto,...cats().ingreso],inc=new Set(['nomina','ingresos','otros ingresos','sueldo','venta']),out=[],seen={};
 for(const line of text.split(/\r?\n/)){const cells=splitLine(line).map(s=>s.trim());let date=null,di=-1;
  cells.forEach((c,i)=>{if(date)return;const m=c.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];date=y+'-'+pad(+m[2])+'-'+pad(+m[1]);di=i}});
  if(!date)continue;let ai=-1;for(let i=di+1;i<cells.length;i++)if(/\d/.test(cells[i])&&!isNaN(parseAmt(cells[i]))&&/€|,\d{2}$|^\d+(\.\d+)?$/.test(cells[i])){ai=i;break}
  if(ai<0)continue;const amount=Math.abs(parseAmt(cells[ai]));if(!amount)continue;
  const desc=cells.slice(di+1,ai).filter(Boolean).join(' ')||'';let rawCat='';for(let i=cells.length-1;i>ai;i--)if(cells[i]&&isNaN(parseAmt(cells[i]))){rawCat=cells[i];break}
  let cat=known.find(k=>norm(k)===norm(rawCat))||(rawCat?rawCat.charAt(0).toUpperCase()+rawCat.slice(1).toLowerCase():'Otros');
  if(norm(rawCat)==='nomina')cat='Nómina';const type=inc.has(norm(rawCat))?'ingreso':'gasto';
  const key=date+'|'+norm(desc)+'|'+amount;seen[key]=(seen[key]||0)+1;
  let h=0;for(const ch of key+seen[key])h=(h*31+ch.charCodeAt(0))|0;
  out.push({id:'imp-'+date+'-'+(h>>>0).toString(36),kind:'tx',type,amount,cat,desc:desc||cat,date,created:now(),imported:true})}
 return out}

yPrev(){year--;render()},yNext(){if(year<+thisMonth().slice(0,4)){year++;render()}},
monthGo(i,v){cur=v;go('resumen')},
catGo(i,v){fcat=v;q='';if(view==='anual')q='';go('movimientos')},
fcat(i,v){fcat=v;render()},
newFixed(){openSheet({mode:'fixed',d:{id:uid(),kind:'fixed',type:'gasto',title:'',amount:'',day:1,cat:'',created:now()}})},
editFixed(id){const f=items.get(id);if(f)openSheet({mode:'fixed',d:{...f}})},
saveFixed(){const d={...sheet.d},a=parseAmt(d.amount);if(!(d.title||'').trim()){toast('Ponle un nombre');return}if(!(a>0)){toast('Pon un importe');return}if(!d.cat){toast('Elige una categoría');return}
 d.title=d.title.trim();d.amount=Math.round(a*100)/100;d.day=Math.min(31,Math.max(1,+d.day||1));
 if(!d.from){d.from=d.day>=+T().slice(8)?thisMonth():addM(thisMonth(),1)}
 save(d);closeSheet();applyFixed();toast(d.from===thisMonth()?'Se apuntará el día '+d.day:'Empieza a apuntarse el mes que viene')},
delFixed(id){const f=items.get(id);closeSheet();remove(id);toast('Fijo borrado (los movimientos ya apuntados se quedan)',()=>save(f))},
newGoal(){openSheet({mode:'goal',d:{id:uid(),kind:'goal',title:'',target:'',due:'',contribs:[],created:now()}})},
editGoal(id){const g=items.get(id);if(g)openSheet({mode:'goal',d:{...g}})},
saveGoal(){const d={...sheet.d},t=parseAmt(d.target);if(!(d.title||'').trim()){toast('Ponle un nombre');return}if(!(t>0)){toast('Pon una meta');return}
 d.title=d.title.trim();d.target=t;const ini=parseAmt(d.initial);delete d.initial;if(ini>0)d.contribs=[...(d.contribs||[]),{date:T(),amount:ini}];save(d);closeSheet()},
askDelGoal(id){openSheet({mode:'cgoal',id})},
delGoal(id){const g=items.get(id);closeSheet();remove(id);toast('Hucha borrada',()=>save(g))},
contrib(id){openSheet({mode:'contrib',id,w:false,d:{amount:''}})},
withdraw(id){openSheet({mode:'contrib',id,w:true,d:{amount:''}})},
saveContrib(){const g=items.get(sheet.id),a=parseAmt(sheet.d.amount);if(!(a>0)){toast('Pon un importe');return}const w=sheet.w;
 const before=saved(g),ng={...g,contribs:[...(g.contribs||[]),{date:T(),amount:w?-a:a}]};save(ng);closeSheet();
 toast(w?`Retirado ${eur(a)}`:(before<g.target&&saved(ng)>=g.target?`¡Meta conseguida: ${g.title}!`:`+${eur(a)} en ${g.title}`),()=>save(g))},
doImp(){const L=parseSheet($('#impT').value);if(!L.length){toast('No encuentro movimientos en ese texto');return}
 const newOnes=L.filter(t=>!items.has(t.id));newOnes.forEach(t=>save(t,true));render();
 toast(newOnes.length?`${newOnes.length} movimientos importados`:'Ya estaba todo importado')},
copyCsv(){const t=csv();navigator.clipboard.writeText(t).then(()=>toast('Copiado: pégalo en tu hoja de cálculo')).catch(()=>toast('No se pudo copiar'))}};

document.addEventListener('click',e=>{if(e.target.id==='ov'){closeSheet();return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.id,b.dataset.v,b)}});
const onField=e=>{const el=e.target;
 if(el.id==='qIn'){q=el.value;render();return}
 if(el.id==='impT'){const L=parseSheet(el.value),g=L.filter(t=>t.type==='gasto').length,ds=L.map(t=>t.date).sort();$('#impP').textContent=L.length?`Encontrados ${L.length} movimientos (${g} gastos, ${L.length-g} ingresos) del ${ds[0].split('-').reverse().join('/')} al ${ds.at(-1).split('-').reverse().join('/')}.`:(el.value?'No encuentro movimientos todavía.':'');return}
 if(!sheet||!el.dataset||!el.dataset.f)return;const f=el.dataset.f,v=el.type==='checkbox'?el.checked:el.value;sheet.d[f]=v;
 if(sheet.mode==='tx'&&f==='desc'&&!sheet.d.cat){const m=txs().filter(t=>t.type===sheet.d.type&&norm(t.desc)===norm(v)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  if(m){sheet.d.cat=m.cat;document.querySelectorAll('#sheet .chip[data-act="pickCat"]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===m.cat)))}}};
document.addEventListener('input',onField);document.addEventListener('change',e=>{if(e.target.id!=='qIn')onField(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet();if(e.key==='Enter'&&sheet&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&!e.target.list){const p=$('#sheet .btn.pri');if(p){e.preventDefault();p.click()}}});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='authF')return;e.preventDefault();
 if(f.dataset.form==='addCat'){const c=f.c.value.trim();if(!c)return;const m=cats();if(m.gasto.some(x=>norm(x)===norm(c))){toast('Ya existe');return}save({id:'cats',kind:'meta',gasto:[...m.gasto,c],ingreso:m.ingreso});toast('Categoría añadida')}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==view){view=h;render()}});

/* ---------- storage (Supabase, tabla fin_items) ---------- */
const CFG=window.BANDEJA_CONFIG||{},CK='hucha-cache-v1';let sb=null,me=null;
function setSync(cls,msg){const s=$('#sync');s.className='sync '+cls;s.querySelector('span').textContent=msg}
function cacheSave(){try{const o={};items.forEach((v,k)=>{const c={...v};delete c.id;o[k]=c});localStorage.setItem(CK,JSON.stringify(o))}catch(e){}}
function cacheLoad(){try{const o=JSON.parse(localStorage.getItem(CK)||'{}');items=new Map(Object.entries(o).map(([k,v])=>[k,{...v,id:k}]))}catch(e){}}
const _render=render;render=function(){_render();if(ready)cacheSave()};
accountHTML=()=>me?`<h2>Cuenta</h2><p class="lede">Conectado como <b style="color:var(--ink)">${esc(me.email)}</b>, la misma cuenta que Bandeja.</p><div class="btns"><button class="btn" data-act="logout">Cerrar sesión</button></div>`:'';
A.logout=async()=>{await sb.auth.signOut();items=new Map();try{localStorage.removeItem(CK)}catch(e){}ready=false;render();showAuth()};
function showAuth(m){$('#auth').hidden=false;$('#authMsg').textContent=m||'';setSync('warn','Sin sesión')}
document.addEventListener('submit',async e=>{if(e.target.id!=='authF')return;e.preventDefault();
 const f=e.target,email=f.email.value.trim(),password=f.pw.value,up=e.submitter&&e.submitter.value==='up',m=$('#authMsg');m.textContent=up?'Creando cuenta…':'Entrando…';
 const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){m.textContent=/Invalid login/i.test(r.error.message)?'Email o contraseña incorrectos.':/registered/i.test(r.error.message)?'Esa cuenta ya existe: pulsa Entrar.':r.error.message;return}
 if(!r.data.session){m.textContent='Revisa tu email para confirmar la cuenta y luego pulsa Entrar.';return}start(r.data.session.user)});
let chan=null,applied=false;
async function pull(){const {data,error}=await sb.from('fin_items').select('id,data');
 if(error){setSync('err','Sin conexión: muestro la copia guardada en este dispositivo.');ready=true;render();return false}
 const local=items;items=new Map(data.map(r=>[r.id,{...r.data,id:r.id}]));
 if(!data.length&&local.size){local.forEach(v=>save(v,true));toast('Subidos a tu cuenta los datos de este dispositivo')}
 ready=true;setSync('ok','Sincronizado entre tus dispositivos');render();return true}
async function start(user){me=user;$('#auth').hidden=true;
 setStore({set:async(id,d)=>{const {error}=await sb.from('fin_items').upsert({user_id:me.id,id,data:d,updated_at:new Date().toISOString()});if(error)throw error},
  del:async id=>{const {error}=await sb.from('fin_items').delete().eq('user_id',me.id).eq('id',id);if(error)throw error}});
 if(await pull()&&!applied){applied=true;applyFixed()}
 if(chan)sb.removeChannel(chan);
 chan=sb.channel('fin-'+me.id)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'fin_items',filter:'user_id=eq.'+me.id},p=>{items.set(p.new.id,{...p.new.data,id:p.new.id});render()})
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'fin_items',filter:'user_id=eq.'+me.id},p=>{items.set(p.new.id,{...p.new.data,id:p.new.id});render()})
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'fin_items'},p=>{if(p.old&&items.has(p.old.id)&&(!p.old.user_id||p.old.user_id===me.id)){items.delete(p.old.id);render()}})
  .subscribe()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)pull().then(ok=>ok&&applyFixed())});
cacheLoad();ready=items.size>0;render();
if(!window.supabase||!CFG.url||!CFG.key){setStore({set:async()=>cacheSave(),del:async()=>cacheSave()});ready=true;setSync('warn','Falta configurar la sincronización: guardado solo en este dispositivo.');render();applyFixed()}
else{sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bandeja-auth'}});
 sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user);else showAuth()})}
}
</script>
