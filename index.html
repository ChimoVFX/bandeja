<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Bandeja · GTD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm desk companion, few words, gentle encouragement
   IDEA: a letter tray on a desk: paper slips land in the tray, then get sorted into lists
   PICTURE: the day sheet: huge hanging date, a progress ring, and the yellow capture slip
   COLOUR and TYPE: cobalt field for the trays, white paper, butter-yellow slip, coral for urgent; Familjen Grotesk + Inter
   LAYOUT: trays as a sidebar on the left, one working column; on the phone the trays become a bottom bar */
:root,:root[data-theme]{color-scheme:dark;
--bg:#0d0f14;--ink:#eceef4;--mut:#8b91a0;--line:#252935;--card:#161920;--raise:#1d212b;
--blue:#5b74ff;--field:#11141b;
--slip:#ffd84a;--slipink:#231d00;--coral:#ff6a4d;--fire:#ff8a1f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
nav{background:var(--field);color:#d6d9e2;border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{font:700 26px/1 'Familjen Grotesk',sans-serif;padding:4px 12px 22px;display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px}
.nv{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;width:100%;opacity:.85;font-weight:500}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:rgba(255,255,255,.06);opacity:1}
.nv[aria-current=page]{background:var(--blue);color:#fff;opacity:1;box-shadow:0 8px 22px -10px var(--blue)}
.brand{color:#fff}.brand svg{color:var(--slip)}
.ct{margin-left:auto;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 8px}
.nv[aria-current=page] .ct{background:rgba(255,255,255,.25);color:#fff}
.ct.hot{background:var(--slip);color:var(--slipink)}
.sep{height:1px;background:var(--line);margin:10px 12px;flex:none}
main{padding:28px clamp(16px,4vw,56px) 64px;max-width:860px;width:100%}
.capture{display:flex;gap:8px;background:var(--slip);color:var(--slipink);border-radius:16px;padding:7px 7px 7px 18px;box-shadow:0 14px 34px -18px rgba(255,216,74,.55);transform:rotate(-.35deg)}
.capture input{flex:1;border:0;background:transparent;font-size:17px;min-height:44px;outline:0;color:var(--slipink)}
.capture input::placeholder{color:rgba(35,29,0,.55)}
.capture button{background:var(--slipink);color:var(--slip);border-radius:11px;padding:0 18px;font-weight:600;min-height:44px;white-space:nowrap}
.sync{font-size:13px;color:var(--mut);margin:12px 4px 0;display:flex;gap:7px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.sync.ok i{background:var(--blue)}.sync.warn i,.sync.err i{background:var(--coral)}
h1{font:700 clamp(32px,5vw,46px)/1.05 'Familjen Grotesk',sans-serif;margin:26px 0 8px;text-wrap:balance}
h2{font:700 19px/1.2 'Familjen Grotesk',sans-serif;margin:30px 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font:500 13px Inter,sans-serif;color:var(--mut)}
.lede{color:var(--mut);margin:0 0 8px;max-width:62ch}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,3vw,28px);align-items:center;margin:28px 0 6px}
.big{font:700 clamp(80px,14vw,128px)/.8 'Familjen Grotesk',sans-serif;color:var(--blue);letter-spacing:-.045em;text-shadow:0 0 40px rgba(91,116,255,.35)}
.hero h1{margin:0 0 4px}.hero .lede{margin:0}
.ring{width:clamp(72px,12vw,104px);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-content:center;font:700 clamp(16px,2.6vw,22px)/1 'Familjen Grotesk',sans-serif;text-align:center}
.ring b small{display:block;font:500 11px Inter,sans-serif;color:var(--mut);margin-top:3px}
.nudge{display:flex;align-items:center;gap:12px;width:100%;margin-top:18px;background:var(--card);border-radius:14px;padding:12px 16px;font-weight:500;min-height:52px}
.nudge b{background:var(--slip);color:var(--slipink);border-radius:99px;padding:1px 10px;font-size:14px}
.nudge span:last-child{margin-left:auto;color:var(--blue);font-weight:600;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:14px;padding:3px 4px 3px 4px}
.chk{width:44px;height:44px;flex:none;display:grid;place-items:center}
.chk::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);transition:.15s}
.chk:hover::before{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.rout .chk::before{border-radius:7px}
.is-done .chk::before{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 4px var(--card)}
.is-done .tt{text-decoration:line-through;color:var(--mut)}
.rt{flex:1;padding:8px 6px;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.tt{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--mut);margin-top:1px}
.meta:empty{display:none}
.late{color:var(--coral);font-weight:600}
.pj{color:var(--blue)}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--mut);flex:none;border-radius:10px}
.ib:hover{color:var(--ink)}
.ib svg{width:20px;height:20px}
.ib.on{color:var(--coral)}.ib.on svg{fill:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{min-height:36px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--mut)}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.flt{display:grid;grid-template-columns:5.5em minmax(0,1fr);align-items:center;gap:0 8px;font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--card);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.warn{color:var(--coral)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:30px 22px;text-align:center;color:var(--mut);margin-top:18px}
.empty b{display:block;color:var(--ink);font:700 21px 'Familjen Grotesk',sans-serif;margin-bottom:4px}
.inline{display:flex;gap:8px;margin:18px 0 12px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}
.ov{position:fixed;inset:0;background:rgba(10,12,22,.5);display:grid;place-items:center;padding:16px;z-index:20}
.ov[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(580px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.55);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.step{font-size:13px;font-weight:600;color:var(--blue)}
.sheet h3{font:700 clamp(24px,4vw,30px)/1.1 'Familjen Grotesk',sans-serif;margin:6px 0 14px;text-wrap:balance}
.slipin{background:var(--slip)!important;color:var(--slipink)!important;border-color:transparent!important;font-weight:500;margin-bottom:16px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 6px}
.in{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;min-height:44px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--blue)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.choices{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choice{min-height:68px;border-radius:14px;border:1.5px solid var(--line);padding:10px 16px;font-weight:600;font-size:17px;background:var(--raise)}
.row,.nudge{border:1px solid var(--line)}.btn{background:var(--raise)}
.choice small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.choice:hover{border-color:var(--blue)}
.choice.pri{background:var(--blue);color:#fff;border-color:var(--blue)}.choice.pri small{color:rgba(255,255,255,.82)}
.back{margin-top:14px;color:var(--mut);font-size:14px;min-height:40px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;z-index:30;font-size:15px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100vw - 24px)}
#toast[hidden]{display:none}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{color:var(--slip);font-weight:600;min-height:36px;padding:0 10px;white-space:nowrap}
.foot{font-size:13px;color:var(--mut);margin-top:40px}
.flame{display:block}.flame .fo,.flame .fi{transform-box:fill-box;transform-origin:50% 100%}
.flame.live .fo{animation:flick 1.8s ease-in-out infinite alternate}.flame.live .fi{animation:flick 1.1s ease-in-out infinite alternate-reverse}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.95,1.05) skewX(-3deg)}100%{transform:scale(1.03,.97) skewX(3deg)}}
.flame.off .fo{fill:#2a2e39}.flame.off .fi{fill:#363b48}.flame.dim{opacity:.55}
.habs{display:grid;gap:14px;margin-top:18px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.htop{display:flex;align-items:center;gap:14px}
.hfl{width:66px;flex:none;text-align:center}.hfl .flame{width:50px;height:63px;margin:0 auto}
.hfl b{display:block;font:700 24px/1 'Familjen Grotesk',sans-serif;color:var(--fire);margin-top:4px}.hfl.off b{color:var(--mut)}
.hinfo{flex:1}.hact{display:flex;align-self:flex-start;margin:-8px -8px 0 0}
.btn.danger{background:var(--coral);border-color:var(--coral);color:#fff}
.cdel{width:56px;margin-bottom:8px}.cdel .flame{width:44px;height:55px}.hinfo .tt{font:700 20px/1.2 'Familjen Grotesk',sans-serif;display:block;min-height:32px}
.hbar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 5px}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d1f,#ffb21f);border-radius:99px;transition:width .6s}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:16px 0 4px;max-width:360px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--mut);font-weight:600}
.wd i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:2px solid transparent}
.wd.on i{background:linear-gradient(180deg,#ffb21f,#ff5a1f)}.wd.on i svg{width:18px;height:18px;fill:#fff;stroke:#fff}
.wd.today{color:var(--ink)}.wd.today i{border:2px dashed var(--fire)}.wd.today.on i{border:2px solid #ffd23f}
.path{display:grid;gap:5px;margin:16px 0 6px;max-width:420px}
.path i{aspect-ratio:1;border-radius:50%;background:var(--raise)}
.path i.on{background:var(--fire)}.path i.ms{outline:2px solid #3a3f4c;outline-offset:1px}.path i.ms.on{outline-color:#ffd23f}
.path i.nx{background:transparent;border:2px dashed var(--fire)}
.hmsg{font-size:14px;margin:10px 0 0;color:var(--mut)}.hmsg.risk{color:var(--coral);font-weight:600}
.btn.fire{background:linear-gradient(180deg,#ff9a1f,#ff5a1f);border:0;color:#fff;box-shadow:0 4px 0 #a8360f;min-height:48px;padding:0 26px}
.btn.fire:active{transform:translateY(3px);box-shadow:0 1px 0 #a8360f}
.btn.donehab{color:var(--fire)}
.badge{font:700 12px Inter,sans-serif;color:#231d00;background:var(--slip);border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.row.hab .mini{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;font:700 13px/1 'Familjen Grotesk',sans-serif;color:var(--fire)}
.row.hab .mini .flame{width:22px;height:28px}
.hchk{width:32px;height:32px;margin:6px;border-radius:50%;border:2px solid var(--fire);display:grid;place-items:center;flex:none;color:#fff}
.hchk.on{background:var(--fire)}.hchk svg{width:16px;height:16px;stroke-width:3}
#cele{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 36%,rgba(255,120,30,.32),transparent 55%),#0a0b0f;padding:24px;overflow:hidden}
#cele[hidden]{display:none}
.cbox{max-width:400px;width:100%;position:relative}
#cele .flame{width:150px;height:188px;margin:0 auto;animation:rise .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rise{from{transform:scale(.2) translateY(50px);opacity:0}}
.cnum{font:700 clamp(84px,22vw,124px)/.9 'Familjen Grotesk',sans-serif;color:#ffb21f;margin-top:4px;text-shadow:0 0 44px rgba(255,140,30,.55)}
.clab{font:700 22px 'Familjen Grotesk',sans-serif;color:#ffb21f}
.ctit{color:#eceef4;font-weight:600;font-size:18px;margin-top:14px}
.cmsg{color:#b8bdc9;margin:6px auto 0;max-width:34ch}
#cele .week{margin:22px auto 4px}
.spark{position:absolute;left:50%;top:22%;width:9px;height:9px;border-radius:50%;background:#ffd23f;opacity:0;animation:spark 1.3s ease-out var(--d) forwards}
.spark:nth-child(3n){background:#ff7a1f;width:6px;height:6px}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
@media(max-width:760px){
 .app{grid-template-columns:minmax(0,1fr)}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;border-right:0;border-top:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;gap:0}
 .brand,.sep{display:none}
 .nv{flex-direction:column;justify-content:center;gap:3px;min-width:70px;width:auto;flex:none;padding:6px 4px;font-size:11px;min-height:56px}
 .ct{position:absolute;top:3px;right:9px;margin:0;font-size:10px;padding:0 6px}
 main{padding:calc(14px + env(safe-area-inset-top)) 16px 120px}
 #toast{bottom:92px}
}
@media(max-width:600px){.g2{grid-template-columns:minmax(0,1fr)}.ov{place-items:end center;padding:0}.sheet{border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
<nav id="nav" aria-label="Listas"></nav>
<main>
 <form id="cap" class="capture" autocomplete="off"><input id="capIn" placeholder="¿Qué tienes en la cabeza?" aria-label="Capturar algo nuevo"><button>Capturar</button></form>

</div>

 <div class="cdel">​</div><div class="step">Bandeja</div><h3>Entra en tu bandeja</h3>

 <div class="btns"><button class="btn pri" value="in" style="flex:1;justify-content:center">Entrar</button><button class="btn" value="up" style="flex:1;justify-content:center">Crear cuenta</button></div>
</form></div>
<script src="supabase.js"></script>
<script src="config.js"></script>

{

/* ---------- routines ---------- */
function matches(r,d){const s=ymd(d);if(r.start&&s<r.start)return false;const f=r.freq||{};
 if(f.type==='daily')return true;
 if(f.type==='weekly')return (f.days||[]).includes(d.getDay());
 if(f.type==='monthly'){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(f.day||1,last)}
 if(f.type==='interval'){const n=Math.round((D(s)-D(r.start||s))/864e5);return n>=0&&n%(f.every||1)===0}
 return false}
function lastOcc(r){const d=D(T());for(let i=0;i<62;i++){if(matches(r,d))return ymd(d);d.setDate(d.getDate()-1)}return null}

function freqLabel(r){const f=r.freq||{};
 if(f.type==='daily')return 'Cada día';
 if(f.type==='weekly'){const d=[1,2,3,4,5,6,0].filter(i=>(f.days||[]).includes(i)).map(i=>DAYSL[i]);return d.length===7?'Cada día':'Cada '+(d.length>1?d.slice(0,-1).join(', ')+' y '+d.at(-1):d[0]||'—')}
 if(f.type==='monthly')return 'El día '+(f.day||1)+' de cada mes';
 if(f.type==='interval')return 'Cada '+(f.every||1)+' días';return ''}

/* ---------- habits ---------- */
const doneToday=h=>(h.log||[]).includes(T());

function weekStrip(h,inter){const s=new Set(h.log||[]),t=T(),L=['D','L','M','X','J','V','S'];let o='';
 for(let i=6;i>=0;i--){const d=addD(t,-i),on=s.has(d),can=inter&&i<=1&&d>=(h.start||d),cls=`wd ${on?'on':''} ${i===0?'today':''}`,inner=`<i>${on?ic('fire'):''}</i>${L[D(d).getDay()]}`;
  o+=can?`<button class="${cls}" data-act="habDay" data-id="${h.id}" data-v="${d}" aria-label="${on?'Desmarcar':'Marcar'} ${rel(d)}">${inner}</button>`:`<span class="${cls}">${inner}</span>`}
 return `<div class="week">${o}</div>`}

function habCard(h){const n=streakOf(h),goal=h.goal||90,td=doneToday(h),best=bestOf(h),total=(h.log||[]).length,risk=!td&&n>0,lost=!td&&!n&&total>0;
 const msg=td?(n>=goal?`Reto superado. Sigue alimentando la llama.`:`Hecho hoy. Vuelve mañana para el día ${n+1}.`):risk?`Tu racha de ${n} ${n>1?'días':'día'} está en peligro. Complétalo hoy.`:lost?'Racha perdida. Hoy es un buen día para volver a empezar.':'Día 1. Todo empieza hoy.';

/* ---------- views ---------- */
function todayData(){const t=T();
 return {open:tasksIn('next').filter(x=>x.star||(x.due&&x.due<=t)).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')),
  waitDue:tasksIn('waiting').filter(x=>x.due&&x.due<=t),
  routs:all('routine').map(r=>({r,o:dueR(r)})).filter(x=>x.o).sort((a,b)=>a.o.localeCompare(b.o)),
  doneT:all('task').filter(x=>x.list==='done'&&x.doneAt===t),

const R={
today(){const d=new Date(),x=todayData(),inbox=tasksIn('inbox').length;

 <div class="ring" role="img" aria-label="${done} de ${total} hechas"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" stroke="var(--line)" stroke-width="9" fill="none"/><circle cx="50" cy="50" r="43" stroke="var(--blue)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><b>${done}/${total}<small>hecho</small></b></div></div>`;
 if(!items.size)return h+`<div class="empty"><b>Tu bandeja está vacía</b>Escribe arriba lo primero que tengas en la cabeza y pulsa Intro. O carga unos ejemplos para ver cómo funciona.<div class="btns" style="justify-content:center"><button class="btn pri" data-act="examples">Cargar ejemplos</button></div></div>`;
 if(inbox)h+=`<button class="nudge" data-act="processAll"><b>${inbox}</b><span>${inbox===1?'cosa':'cosas'} en la entrada sin procesar</span><span>Procesar →</span></button>`;
 if(x.routs.length)h+=`<h2>Rutinas <small>${x.routs.length}</small></h2><div class="list">${x.routs.map(y=>routRow(y.r,y.o)).join('')}</div>`;
 if(x.habs.length)h+=`<h2>Hábitos <small>${hd} de ${x.habs.length}</small></h2><div class="list">${x.habs.map(habRow).join('')}</div>`;

  const sug=pool.filter(t=>(!F.ctx||t.ctx===F.ctx)&&(!F.mins||!t.mins||t.mins<=+F.mins)&&(!F.energy||ER[t.energy||'baja']<=ER[F.energy]));

function clTo(dest){const d=clean(sheet.d),x=sheet.d;
 if(dest==='trash'){const old=items.get(d.id);remove(d.id);advance();toast('A la papelera',()=>save(old));return}

 else if(dest==='project'){const pid=uid();save({id:pid,kind:'project',title:(x.ptitle??d.title).trim()||d.title,outcome:'',created:now()});
  if((x.first||'').trim())save({...d,title:x.first.trim(),list:'next',project:pid});else remove(d.id)}
 else save({...d,list:dest});

nav:(i,v)=>go(v),
done(id){const t=items.get(id);if(!t)return;if(t.list==='done'){save({...t,list:t.prev||'next',doneAt:null});return}

closeSheet,

editRout(id){const r=items.get(id);if(r)openSheet({mode:'rout',d:{...r,freq:{...r.freq}}})},
saveRout(){const d={...sheet.d};if(!(d.title||'').trim()){toast('Ponle un nombre');return}
 if(d.freq.type==='weekly'&&!(d.freq.days||[]).length){toast('Elige al menos un día');return}
 d.title=d.title.trim();save(d);closeSheet()},
delRout(id){const r=items.get(id);closeSheet();remove(id);toast('Rutina eliminada',()=>save(r))},
routDone(id){const r=items.get(id);if(!r)return;
 if(r.lastDone===T()){save({...r,lastDone:r.prevDone||null,count:Math.max(0,(r.count||1)-1)});return}
 const old={...r};save({...r,prevDone:r.lastDone||null,lastDone:T(),count:(r.count||0)+1});toast('Rutina hecha: '+r.title,()=>save(old))},
newProj(){openSheet({mode:'proj',d:{id:uid(),kind:'project',title:'',outcome:'',created:now()}})},
editProj(id){const p=items.get(id);if(p)openSheet({mode:'proj',d:{...p}})},
saveProj(){const x=sheet.d,d=clean(x);if(!(d.title||'').trim()){toast('Ponle un nombre');return}d.title=d.title.trim();save(d);
 if((x.first||'').trim())save({id:uid(),kind:'task',title:x.first.trim(),list:'next',project:d.id,created:now()});closeSheet()},
delProj(id){const p=items.get(id);closeSheet();openProj=null;remove(id);toast('Proyecto eliminado',()=>save(p))},
openProj(id){openProj=id;render();window.scrollTo(0,0)},
closeDetail(){openProj=null;render()},
finishProj(id){const p=items.get(id);openProj=null;save({...p,closed:true,closedAt:T()});toast('Proyecto terminado: '+p.title,()=>save(p))},
nctx(i,v){nextCtx=v||null;render()},
newHab(){openSheet({mode:'hab',d:{id:uid(),kind:'habit',title:'',why:'',goal:90,log:[],start:T(),created:now()}})},
editHab(id){const h=items.get(id);if(h)openSheet({mode:'hab',d:{...h}})},
saveHab(){const d={...sheet.d};if(!(d.title||'').trim()){toast('Ponle un nombre');return}d.title=d.title.trim();save(d);closeSheet()},
delHab(id){const h=items.get(id);closeSheet();remove(id);toast('Hábito eliminado',()=>save(h))},
habDay(id,day){const h=items.get(id);if(!h)return;const L=new Set(h.log||[]);
 if(L.has(day)){L.delete(day);save({...h,log:[...L].sort()});toast('Desmarcado');return}
 L.add(day);const nh={...h,log:[...L].sort()};save(nh);celebrate(nh)},
celeClose(){$('#cele').hidden=true},
copyExp(){const t=$('#expT'),txt=exportJSON();navigator.clipboard.writeText(txt).then(()=>toast('Datos copiados')).catch(()=>{t.focus();t.select();toast('Mantén pulsado y copia el texto')})},
doImp(){const t=$('#impT');let o;try{o=JSON.parse(t.value);o=o.items||o}catch(e){toast('Ese texto no es una copia válida');return}
 let n=0;for(const [k,v] of Object.entries(o||{}))if(v&&typeof v==='object'&&v.kind){save({...v,id:k});n++}
 toast(n?n+' elementos importados':'No había nada que importar')},
askDelHab(id){if(items.get(id))openSheet({mode:'confirm',id})},
tf(i,v){const k=v.slice(0,v.indexOf(':')),val=v.slice(v.indexOf(':')+1);F[k]=F[k]===val?null:val;render()},
revT(i,v){const r=reviewDoc(),n=+v,dn=r.done.includes(n)?r.done.filter(x=>x!==n):[...r.done,n];const o={...r,done:dn};
 if(dn.length===REVIEW.length){o.last=T();toast('Revisión semanal completa. Sistema al día.')}save(o)},
purge(){const lim=addD(T(),-30),old=all('task').filter(t=>t.list==='done'&&(t.doneAt||'')<lim);old.forEach(t=>remove(t.id));toast(old.length?old.length+' borradas':'Nada tan antiguo')},
examples(){const c=now(),p=uid(),t=(title,list,x={})=>save({id:uid(),kind:'task',title,list,created:c,...x});
 t('Imprimir los apuntes de la clase','inbox');t('Preparar la clase para Marta','inbox');t('Llamar al gestor por el IVA del trimestre','inbox');
 save({id:p,kind:'project',title:'Web portfolio',outcome:'Web publicada con las mejores piezas',created:c});
 t('Elegir 6 piezas para el portfolio','next',{ctx:'@ordenador',mins:30,energy:'media',project:p,star:true});
 t('Comprar cartuchos de tinta','next',{ctx:'@recados',mins:15,energy:'baja'});
 t('Presupuesto firmado del cliente','waiting',{who:'Cliente',due:addD(T(),3)});
 t('Aprender a tocar el ukelele','someday');
 const r=(title,days,ctx)=>save({id:uid(),kind:'routine',title,freq:{type:'weekly',days},ctx,start:T(),created:c,count:0});
 r('Actualizar la hoja de gastos',[5],'@ordenador');r('Limpiar la casa',[6],'@casa');r('Revisión semanal',[5],'');
 save({id:uid(),kind:'habit',title:'Leer 20 minutos',why:'Desconectar de pantallas antes de dormir',goal:90,log:[addD(T(),-3),addD(T(),-2),addD(T(),-1)],start:addD(T(),-3),created:c});
 toast('Ejemplos cargados. Bórralos cuando quieras.')}};

document.addEventListener('click',e=>{if(e.target.id==='ov'){closeSheet();return}const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.id,b.dataset.v,b)}});
const onField=e=>{const el=e.target;if(!sheet||!el.dataset||!el.dataset.f)return;let v=el.type==='checkbox'?el.checked:el.value;if('num' in el.dataset)v=Math.max(1,Number(v)||1);setPath(sheet.d,el.dataset.f,v);if(el.dataset.f==='ctx')syncChips('ctx')};
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#cele').hidden){$('#cele').hidden=true;return}if(e.key==='Escape'&&sheet)closeSheet();
 if(e.key==='Enter'&&sheet&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){const p=$('#sheet .btn.pri');if(p){e.preventDefault();p.click()}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='cap'){const v=$('#capIn').value.trim();if(!v)return;const id=uid();save({id,kind:'task',title:v,list:'inbox',created:now()});$('#capIn').value='';toast('Capturado en Entrada',()=>openClarify(id,false),'Procesar ya');return}
 if(f.dataset.form==='projAdd'){const v=f.t.value.trim();if(!v||!openProj)return;save({id:uid(),kind:'task',title:v,list:'next',project:openProj,created:now()});setTimeout(()=>{const i=$('form[data-form="projAdd"] input');if(i)i.focus()},0)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==view){view=h;openProj=null;render()}});
let lastDay=T();setInterval(()=>{if(T()!==lastDay){lastDay=T();render()}},60000);

/* ---------- storage (Supabase) ---------- */
const CFG=window.BANDEJA_CONFIG||{},CK='bandeja-cache-v1';let sb=null,me=null;
function setSync(cls,msg){const s=$('#sync');s.className='sync '+cls;s.querySelector('span').textContent=msg}
function cacheSave(){try{localStorage.setItem(CK,JSON.stringify(JSON.parse(exportJSON()).items))}catch(e){}}
function cacheLoad(){try{const o=JSON.parse(localStorage.getItem(CK)||'{}');items=new Map(Object.entries(o).map(([k,v])=>[k,{...v,id:k}]))}catch(e){}}
const _render=render;render=function(){_render();if(ready)cacheSave()};
accountHTML=()=>me?`<h2>Cuenta</h2><p class="lede">Conectado como <b style="color:var(--ink)">${esc(me.email)}</b>. Todo se sincroniza con esta cuenta.</p><div class="btns"><button class="btn" data-act="logout">Cerrar sesión</button></div>`:'';
A.logout=async()=>{await sb.auth.signOut();items=new Map();try{localStorage.removeItem(CK)}catch(e){}ready=false;render();showAuth()};
function showAuth(msg){$('#auth').hidden=false;$('#authMsg').textContent=msg||'';setSync('warn','Sin sesión')}
document.addEventListener('submit',async e=>{if(e.target.id!=='authF')return;e.stopImmediatePropagation();e.preventDefault();
 const f=e.target,email=f.email.value.trim(),password=f.pw.value,up=e.submitter&&e.submitter.value==='up',m=$('#authMsg');
 m.textContent=up?'Creando cuenta…':'Entrando…';
 const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){m.textContent=/Invalid login/i.test(r.error.message)?'Email o contraseña incorrectos.':/registered/i.test(r.error.message)?'Esa cuenta ya existe: pulsa Entrar.':r.error.message;return}
 if(!r.data.session){m.textContent='Revisa tu email para confirmar la cuenta y luego pulsa Entrar.';return}
 start(r.data.session.user)},true);
let chan=null;
async function pull(){const {data,error}=await sb.from('items').select('id,data');
 if(error){setSync('err','Sin conexión: muestro la copia guardada en este dispositivo.');ready=true;render();return}
 const local=items;items=new Map(data.map(r=>[r.id,{...r.data,id:r.id}]));
 if(!data.length&&local.size){local.forEach(v=>save(v));toast('Subidos a tu cuenta los datos de este dispositivo')}
 ready=true;setSync('ok','Sincronizado entre tus dispositivos');render()}
async function start(user){me=user;$('#auth').hidden=true;
 setStore({set:async(id,d)=>{const {error}=await sb.from('items').upsert({user_id:me.id,id,data:d,updated_at:new Date().toISOString()});if(error)throw error},
  del:async id=>{const {error}=await sb.from('items').delete().eq('user_id',me.id).eq('id',id);if(error)throw error}});
 await pull();
 if(chan)sb.removeChannel(chan);
 chan=sb.channel('items-'+me.id)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'items',filter:'user_id=eq.'+me.id},p=>{items.set(p.new.id,{...p.new.data,id:p.new.id});render()})
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'items',filter:'user_id=eq.'+me.id},p=>{items.set(p.new.id,{...p.new.data,id:p.new.id});render()})
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'items'},p=>{if(p.old&&(!p.old.user_id||p.old.user_id===me.id)&&items.has(p.old.id)){items.delete(p.old.id);render()}})
  .subscribe();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)pull()});
cacheLoad();if(items.size)ready=true;render();
if(!window.supabase||!CFG.url||!CFG.key){
 const LK='bandeja-local';setStore({set:async()=>cacheSave(),del:async()=>cacheSave()});ready=true;
 setSync('warn','Falta configurar la sincronización: guardado solo en este dispositivo.');render();
}else{
 sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bandeja-auth'}});
 sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user);else showAuth()});
}
}
</script>
